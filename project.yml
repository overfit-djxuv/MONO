name: MONO
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple team in Xcode (Signing & Capabilities) or put the 10-character Team ID here.
    DEVELOPMENT_TEAM: YOURTEAMID
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MONO:
    type: application
    platform: iOS
    sources:
      - path: MONO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.monoapp
        PRODUCT_NAME: MONO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "icon-glass-slate icon-glass-bronze icon-glass-graphite icon-orbit-forest icon-orbit-slate icon-orbit-bronze icon-orbit-graphite icon-dusk-forest icon-dusk-slate icon-dusk-bronze icon-dusk-graphite"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MONO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "MONO uses Face ID to keep your finances private."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  MONOTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MONOTests]
    dependencies:
      - target: MONO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.monoapp.tests
  MONOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MONOUITests]
    dependencies:
      - target: MONO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.monoapp.uitests
schemes:
  MONO:
    build:
      targets:
        MONO: all
    test:
      targets: [MONOTests, MONOUITests]
